name: MetaMask Security Code Scanner

on:
  push:
    branches:
      - dev
      - main
  pull_request:
    branches:
      - dev
      - main
  workflow_call:
    secrets:
      SECURITY_SCAN_METRICS_TOKEN:
        required: false
      APPSEC_BOT_SLACK_WEBHOOK:
        required: false
  workflow_dispatch:

permissions: {} # lock everything by default (least-privilege)

jobs:
  security-scan:
    permissions:
      actions: read
      contents: read
      security-events: write
    uses: MetaMask/action-security-code-scanner/.github/workflows/security-scan.yml@ff5edd492dfd4a70813066fe9f1552a2ac13766f # v2.1.0
    with:
      repo: ${{ github.repository }}
      scanner-ref: "ff5edd492dfd4a70813066fe9f1552a2ac13766f"
      paths-ignored: |
        node_modules
        **/node_modules/**
        **/__snapshots__/
        __snapshots_linux__
        **/__stories__/
        .storybook/
        **/*.test.ts
        **/*.test.tsx
        **/*.test.js
        **/*.test.jsx
        **/*.spec.ts
        **/*.spec.tsx
        **/*.spec.js
        **/*.spec.jsx
        **/test*/**
        **/e2e/**
        **/tests/**
      languages-config: |
        [
        ]
    secrets:
      project-metrics-token: ${{ secrets.SECURITY_SCAN_METRICS_TOKEN }}
      slack-webhook: ${{ secrets.APPSEC_BOT_SLACK_WEBHOOK }}
