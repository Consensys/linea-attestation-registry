[profile.default]
src = "src"
out = "out"
libs = ["lib"]
remappings = [
    "@openzeppelin/=node_modules/@openzeppelin/",
    "@verax-attestation-registry/=node_modules/@verax-attestation-registry/",
    "@verax-attestation-registry/verax-contracts/=node_modules/@verax-attestation-registry/verax-contracts/",
]
optimizer = true
optimizer_runs = 200
solc-version = "0.8.21"

[profile.ci]
fuzz_runs = 1000
verbosity = 4

# See more config options https://github.com/foundry-rs/foundry/blob/master/crates/config/README.md#all-options 