name: SDK

on:
  pull_request:
    branches:
      - main
      - dev
      - release/*
  push:
    branches:
      - main
      - dev
      - release/*

permissions: {} # lock everything by default (least-privilege)

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit-test-sdk:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    defaults:
      run:
        working-directory: sdk

    steps:
      - name: Check out the repo
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Setup environment
        uses: ./.github/actions/setup-env

      - name: Run the unit tests
        run: pnpm run test:unit:coverage

      - name: Move the report at the root of the 'sdk' folder
        run: mv coverage/lcov.info .

      - name: Upload coverage report to Codecov
        if: env.CODECOV_TOKEN != ''
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v7.0.0
        with:
          files: ./sdk/lcov.info
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: true
          skip_validation: true
          verbose: true

      - name: Check test coverage
        uses: terencetcf/github-actions-lcov-minimum-coverage-checker@537e486d32b4763f3be8fbe81a79c3421071b190 # v1.4.1
        with:
          coverage-file: sdk/lcov.info
          minimum-coverage: 50

      - name: Add coverage summary if upload
        if: env.CODECOV_TOKEN != ''
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
        run: |
          echo "## Coverage result" >> $GITHUB_STEP_SUMMARY
          echo "✅ Uploaded to Codecov" >> $GITHUB_STEP_SUMMARY

      - name: Add coverage summary if no upload
        if: env.CODECOV_TOKEN == ''
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
        run: |
          echo "## Coverage result" >> $GITHUB_STEP_SUMMARY
          echo "✅ Coverage not uploaded to Codecov" >> $GITHUB_STEP_SUMMARY

  integration-test-sdk:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    defaults:
      run:
        working-directory: sdk

    steps:
      - name: Check out the repo
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Setup environment
        uses: ./.github/actions/setup-env

      - name: Check Linea Sepolia subgraph availability
        id: linea-sepolia-subgraph
        run: |
          response="$(curl -sS -X POST "https://api.studio.thegraph.com/query/67521/verax-v2-linea-sepolia/v0.0.3" \
            -H "content-type: application/json" \
            --data '{"query":"{ portals(first: 1) { id } }"}')"

          if echo "$response" | grep -q '"errors"'; then
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "$response"
          else
            echo "available=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Run the integration tests
        if: steps.linea-sepolia-subgraph.outputs.available == 'true'
        run: pnpm run test:integration:ci

      - name: Integration tests summary
        if: steps.linea-sepolia-subgraph.outputs.available == 'true'
        run: |
          echo "## Integration tests result" >> $GITHUB_STEP_SUMMARY
          echo "✅ All passed" >> $GITHUB_STEP_SUMMARY

      - name: Integration tests skipped summary
        if: steps.linea-sepolia-subgraph.outputs.available != 'true'
        run: |
          echo "## Integration tests result" >> $GITHUB_STEP_SUMMARY
          echo "✅ Skipped because the external Linea Sepolia subgraph is unavailable" >> $GITHUB_STEP_SUMMARY
