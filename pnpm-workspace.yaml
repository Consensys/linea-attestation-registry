packages:
  - contracts
  - examples
  - explorer
  - sdk
  - subgraph
  - tutorial

allowBuilds:
  '@parcel/watcher': true
  '@reown/appkit': false
  bufferutil: true
  esbuild: true
  keccak: true
  netlify-cli: false
  node-libcurl: true
  secp256k1: true
  sharp: true
  unix-dgram: true
  unrs-resolver: true
  utf-8-validate: true

catalogs:
  core:
    prettier: 3.8.4
    typescript: 5.9.3
  eslint:
    '@eslint/js': 9.39.4
    eslint: 9.39.4
    eslint-plugin-import-x: 4.17.0
    globals: 16.5.0
    typescript-eslint: 8.62.0
  react:
    react: 19.2.7
    react-dom: 19.2.7
    '@tanstack/react-query': 5.101.1
    '@types/react': 19.2.17
    '@types/react-dom': 19.2.3
    eslint-plugin-react: 7.37.5
    eslint-plugin-react-hooks: 5.2.0
    eslint-plugin-react-refresh: 0.5.3
    vite-plugin-radar: 0.11.0
  solidity:
    '@openzeppelin/contracts': 4.9.6
    '@openzeppelin/contracts-upgradeable': 4.9.6
    solhint: 6.2.3
  types:
    '@types/node': 22.20.0
  web3:
    viem: 2.53.1

overrides:
  babel-jest>babel-plugin-istanbul: '8.0.2'
  '@jest/transform>babel-plugin-istanbul': '8.0.2'
  '@ardatan/relay-compiler>immutable': '5.1.5'
  '@babel/core@<=7.29.0': '7.29.6'
  '@opentelemetry/core@<2.8.0': '2.8.0'
  '@graphprotocol/graph-cli>js-yaml': '3.14.2' # Required by graph-cli
  '@graphprotocol/graph-cli>undici': '7.28.0'
  '@graphprotocol/graph-cli>yaml': '2.8.3'
  '@nomicfoundation/hardhat-verify>undici': '6.27.0'
  axios@<0.31.0: '1.18.1'
  bn.js@<4.12.3: '4.12.3'
